name: TestFlight

on:
  push:
    branches: [master]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  verify_merge:
    name: Verify owner merge
    if: >-
      github.repository == 'rawcontext/luxel' &&
      github.repository_id == '1269656539' &&
      github.actor_id == '302437' &&
      github.triggering_actor == 'ccheney' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: macos-26
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.merge.outputs.authorized }}
    steps:
      - name: Check out pushed master commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify this commit was merged by the owner
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_owner_merge.py

  unit_tests:
    needs: verify_merge
    name: Unit tests after merge
    if: >-
      github.repository == 'rawcontext/luxel' &&
      github.repository_id == '1269656539' &&
      github.actor_id == '302437' &&
      github.triggering_actor == 'ccheney' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.verify_merge.outputs.authorized == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Ruby and Fastlane
        uses: ./.github/actions/setup-ruby
        with:
          bundle-install: "true"

      - name: Verify toolchain
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          swift --version
          ruby --version
          gh --version

      - name: Test workflow policy and App Store sync
        run: |
          gem install minitest --version 6.0.6 --no-document
          ruby .github/scripts/workflow_trust_test.rb
          python3 .github/scripts/verify_owner_merge_test.py
          ruby .github/scripts/sync_app_store_reviews_test.rb
          ruby .github/scripts/sync_app_store_crashes_test.rb
          ruby .github/scripts/sync_app_store_actionable_test.rb

      - name: Verify Fastlane loads
        working-directory: apps/macos
        run: bundle exec fastlane lanes

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache Rust dependencies and compiled tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/cli/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('apps/cli/rust-toolchain.toml', 'apps/cli/Cargo.lock') }}-${{ hashFiles('apps/cli/src/**', 'apps/cli/tests/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('apps/cli/rust-toolchain.toml', 'apps/cli/Cargo.lock') }}-

      - name: Test CLI and website workspaces
        run: |
          bun install --frozen-lockfile
          bunx turbo run test --filter=@luxel/cli --filter=@luxel/web

      - name: Restore Swift build cache
        id: swift-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/macos/.build/artifacts
            apps/macos/.build/checkouts
            apps/macos/.build/repositories
            apps/macos/.build/arm64-apple-macosx
            apps/macos/.build/build.db
            apps/macos/.build/debug.yaml
            apps/macos/.build/release.yaml
            apps/macos/.build/workspace-state.json
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-xcode26.6-17F113-v1-${{ hashFiles('apps/macos/Package.swift', 'apps/macos/Package.resolved', 'apps/macos/Vendor/Artifacts/manifest.json') }}-${{ hashFiles('apps/macos/Sources/**', 'apps/macos/Tests/**') }}-tests
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-xcode26.6-17F113-v1-${{ hashFiles('apps/macos/Package.swift', 'apps/macos/Package.resolved', 'apps/macos/Vendor/Artifacts/manifest.json') }}-

      - name: Build and test macOS localizations
        working-directory: apps/macos
        run: swift test --filter LocalizationTests

      - name: Save compiled Swift test cache
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/macos/.build/artifacts
            apps/macos/.build/checkouts
            apps/macos/.build/repositories
            apps/macos/.build/arm64-apple-macosx
            apps/macos/.build/build.db
            apps/macos/.build/debug.yaml
            apps/macos/.build/release.yaml
            apps/macos/.build/workspace-state.json
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

      - name: Test macOS package
        timeout-minutes: 5
        working-directory: apps/macos
        run: |
          (
            sleep 90
            for test_pid in $(pgrep -x swiftpm-testing); do
              sample "$test_pid" 5 -file "$RUNNER_TEMP/swift-test-$test_pid.sample.txt" || true
            done
          ) &
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true' EXIT
          swift test --skip-build --no-parallel

      - name: Upload stalled-test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-test-diagnostics
          path: ${{ runner.temp }}/swift-test-*.sample.txt
          if-no-files-found: ignore

      - name: Test App Store metadata exporter
        run: node --test app-store/export-listing-metadata.test.mjs

  testflight:
    needs: [verify_merge, unit_tests]
    name: Build and Upload to TestFlight
    if: >-
      github.repository == 'rawcontext/luxel' &&
      github.repository_id == '1269656539' &&
      github.actor_id == '302437' &&
      github.triggering_actor == 'ccheney' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.verify_merge.outputs.authorized == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      MAC_APP_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.MAC_APP_DISTRIBUTION_CERTIFICATE_BASE64 }}
      MAC_APP_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APP_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64 }}
      MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      MAC_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Check out owner-merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Ruby
        uses: ./.github/actions/setup-ruby
        with:
          bundle-install: "true"

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Cache Swift release build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/macos/.build/artifacts
            apps/macos/.build/checkouts
            apps/macos/.build/repositories
            apps/macos/.build/arm64-apple-macosx
            apps/macos/.build/build.db
            apps/macos/.build/debug.yaml
            apps/macos/.build/release.yaml
            apps/macos/.build/workspace-state.json
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-xcode26.6-17F113-v1-${{ hashFiles('apps/macos/Package.swift', 'apps/macos/Package.resolved', 'apps/macos/Vendor/Artifacts/manifest.json') }}-${{ hashFiles('apps/macos/Sources/**', 'apps/macos/Tests/**') }}-release
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-xcode26.6-17F113-v1-${{ hashFiles('apps/macos/Package.swift', 'apps/macos/Package.resolved', 'apps/macos/Vendor/Artifacts/manifest.json') }}-${{ hashFiles('apps/macos/Sources/**', 'apps/macos/Tests/**') }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-xcode26.6-17F113-v1-${{ hashFiles('apps/macos/Package.swift', 'apps/macos/Package.resolved', 'apps/macos/Vendor/Artifacts/manifest.json') }}-

      - name: Set timestamp build number
        run: echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        working-directory: apps/macos
        run: bundle exec fastlane mac release_testflight
