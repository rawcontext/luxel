name: TestFlight

on:
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  verify_merge:
    name: Verify owner merge and release tag
    if: >-
      github.repository == 'rawcontext/luxel' &&
      github.repository_id == '1269656539' &&
      github.actor_id == '302437' &&
      github.triggering_actor == 'ccheney' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-26
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      authorized: ${{ steps.merge.outputs.authorized }}
      marketing_version: ${{ steps.merge.outputs.marketing_version }}
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify owner merge and passing tests for release tags
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_owner_merge.py

  unit_tests:
    needs: verify_merge
    name: Unit tests after merge
    if: >-
      github.repository == 'rawcontext/luxel' &&
      github.repository_id == '1269656539' &&
      github.actor_id == '302437' &&
      github.triggering_actor == 'ccheney' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.verify_merge.outputs.authorized == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Ruby and Fastlane
        uses: ./.github/actions/setup-ruby
        with:
          bundle-install: "true"

      - name: Verify toolchain
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          swift --version
          ruby --version
          gh --version

      - name: Set up Bazel
        id: bazel
        uses: ./.github/actions/setup-bazel

      - name: Verify Fastlane loads
        working-directory: apps/macos
        run: bundle exec fastlane lanes

      - name: Test and lint all languages
        run: >-
          bazel test --config=ci //:tests //:lint
          --build_event_json_file="$RUNNER_TEMP/bazel-tests.json"
          --profile="$RUNNER_TEMP/bazel-tests.profile.json.gz"

      - name: Build the complete target graph
        run: >-
          bazel build --config=ci //...
          --build_event_json_file="$RUNNER_TEMP/bazel-build.json"

      - name: Save Bazel caches
        if: always() && !cancelled()
        uses: ./.github/actions/save-bazel-cache
        with:
          action-cache-key: ${{ steps.bazel.outputs.action-cache-key }}
          repository-cache-key: ${{ steps.bazel.outputs.repository-cache-key }}
          repository-cache-hit: ${{ steps.bazel.outputs.repository-cache-hit }}

      - name: Upload Bazel reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-reports
          path: ${{ runner.temp }}/bazel-*.json*
          if-no-files-found: ignore

  testflight:
    needs: verify_merge
    name: Build and Upload to TestFlight
    if: >-
      github.repository == 'rawcontext/luxel' &&
      github.repository_id == '1269656539' &&
      github.actor_id == '302437' &&
      github.triggering_actor == 'ccheney' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.verify_merge.outputs.authorized == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MARKETING_VERSION: ${{ needs.verify_merge.outputs.marketing_version }}
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      MAC_APP_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.MAC_APP_DISTRIBUTION_CERTIFICATE_BASE64 }}
      MAC_APP_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APP_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64 }}
      MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      MAC_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Ruby
        uses: ./.github/actions/setup-ruby
        with:
          bundle-install: "true"

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Set up Bazel
        id: bazel
        uses: ./.github/actions/setup-bazel

      - name: Set timestamp build number
        run: echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        working-directory: apps/macos
        run: bundle exec fastlane mac release_testflight

      - name: Save Bazel caches
        if: always() && !cancelled()
        uses: ./.github/actions/save-bazel-cache
        with:
          action-cache-key: ${{ steps.bazel.outputs.action-cache-key }}
          repository-cache-key: ${{ steps.bazel.outputs.repository-cache-key }}
          repository-cache-hit: ${{ steps.bazel.outputs.repository-cache-hit }}
