name: TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Optional CFBundleShortVersionString override"
        required: false
        type: string
      build_number:
        description: "Optional CFBundleVersion override"
        required: false
        type: string
      changelog:
        description: "Optional TestFlight 'What to Test' text"
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and Upload to TestFlight
    runs-on: macos-26
    permissions:
      contents: read
    env:
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      MAC_APP_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.MAC_APP_DISTRIBUTION_CERTIFICATE_BASE64 }}
      MAC_APP_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APP_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64 }}
      MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      MAC_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
      MARKETING_VERSION: ${{ github.event.inputs.marketing_version }}
      BUILD_NUMBER: ${{ github.event.inputs.build_number }}
      TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.changelog }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read tool versions
        id: tool-versions
        run: |
          ruby_version="$(awk '$1 == "ruby" { print $2 }' .tool-versions)"
          echo "ruby=${ruby_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.tool-versions.outputs.ruby }}
          bundler-cache: true
          working-directory: apps/macos

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Resolve release inputs
        run: |
          marketing_version="${MARKETING_VERSION}"

          if [[ -z "${marketing_version}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "Tag ${GITHUB_REF_NAME} must match v<major>.<minor>[.<patch>] to derive MARKETING_VERSION." >&2
              exit 1
            fi

            marketing_version="${GITHUB_REF_NAME#v}"
          fi

          if [[ -n "${marketing_version}" ]]; then
            echo "MARKETING_VERSION=${marketing_version}" >> "${GITHUB_ENV}"
            echo "Resolved MARKETING_VERSION=${marketing_version}"
          else
            echo "MARKETING_VERSION not set; package script will use Info.plist."
          fi

      - name: Upload to TestFlight
        working-directory: apps/macos
        run: bundle exec fastlane mac release_testflight
