name: App Store Metadata Draft

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Editable App Store Connect version to update (for example, 1.2.0)"
        required: true
        type: string

concurrency:
  group: app-store-metadata
  cancel-in-progress: false

jobs:
  sync-metadata:
    name: Update Metadata Draft
    runs-on: macos-26
    permissions:
      contents: read
    env:
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_VERSION: ${{ inputs.app_version }}
      APP_STORE_METADATA_PATH: ${{ runner.temp }}/luxel-app-store-metadata

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read Ruby version
        id: ruby-version
        run: |
          ruby_version="$(awk '$1 == "ruby" { print $2 }' .tool-versions)"
          echo "ruby=${ruby_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.ruby-version.outputs.ruby }}
          bundler-cache: true
          working-directory: apps/macos

      - name: Validate metadata source and exporter
        run: |
          node docs/ux/app-store/validate-listing-metadata.mjs
          node --test docs/ux/app-store/export-listing-metadata.test.mjs

      - name: Export temporary Fastlane metadata
        run: node docs/ux/app-store/export-listing-metadata.mjs "$APP_STORE_METADATA_PATH"

      - name: Update App Store Connect metadata draft
        working-directory: apps/macos
        run: bundle exec fastlane mac sync_app_store_metadata
