name: App Store Release

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "App Store version to submit"
        required: true
        type: string
      build_number:
        description: "Processed App Store Connect build to submit"
        required: true
        type: string

concurrency:
  group: app-store-release
  cancel-in-progress: false

jobs:
  submit:
    name: Update Review Instructions and Submit
    runs-on: macos-26
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_VERSION: ${{ inputs.app_version }}
      APP_STORE_BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Ruby version
        id: ruby-version
        run: |
          ruby_version="$(awk '$1 == "ruby" { print $2 }' .tool-versions)"
          echo "ruby=${ruby_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ steps.ruby-version.outputs.ruby }}
          bundler-cache: true
          working-directory: apps/macos

      - name: Submit build without changing storefront metadata
        working-directory: apps/macos
        run: bundle exec fastlane mac submit_app_store_release
