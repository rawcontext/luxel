name: App Store Release

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "App Store version to submit"
        required: true
        type: string
      build_number:
        description: "Processed App Store Connect build to submit"
        required: true
        type: string

concurrency:
  group: app-store-release
  cancel-in-progress: false

jobs:
  submit:
    name: Update Review Instructions and Submit
    runs-on: [self-hosted, macOS, ARM64, luxel-desktop]
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_VERSION: ${{ inputs.app_version }}
      APP_STORE_BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ./.github/actions/setup-ruby
        with:
          bundle-install: "true"

      - name: Submit build without changing storefront metadata
        working-directory: apps/macos
        run: bundle exec fastlane mac submit_app_store_release
