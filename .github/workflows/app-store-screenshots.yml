name: App Store Localized Screenshots

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Editable App Store Connect version to update (for example, 1.2.0)"
        required: true
        type: string

concurrency:
  group: app-store-screenshots
  cancel-in-progress: false

jobs:
  sync-screenshots:
    name: Update Localized Screenshots
    runs-on: macos-26
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_ENABLE_BETA_DELIVER_SYNC_SCREENSHOTS: "true"
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_VERSION: ${{ inputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Read Ruby version
        id: ruby-version
        run: |
          ruby_version="$(awk '$1 == "ruby" { print $2 }' .tool-versions)"
          echo "ruby=${ruby_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ steps.ruby-version.outputs.ruby }}
          bundler-cache: true
          working-directory: apps/macos

      - name: Configure temporary screenshot paths
        run: |
          {
            echo "APP_STORE_SCREENSHOTS_PATH=$GITHUB_WORKSPACE/docs/design/app-store-localized"
            echo "APP_STORE_SCREENSHOTS_RENDERED_PATH=$RUNNER_TEMP/luxel-app-store-screenshots"
            echo "APP_STORE_SCREENSHOTS_MANIFEST=$RUNNER_TEMP/luxel-app-store-screenshots.json"
          } >> "$GITHUB_ENV"

      - name: Render and validate localized screenshots
        run: |
          node docs/ux/app-store/validate-listing-metadata.mjs
          swift docs/ux/app-store/render-localized-screenshots.swift \
            --output "$APP_STORE_SCREENSHOTS_RENDERED_PATH" \
            --manifest "$APP_STORE_SCREENSHOTS_MANIFEST"
          test "$(find "$APP_STORE_SCREENSHOTS_PATH" -type f | wc -l | tr -d ' ')" = "66"
          test "$(find "$APP_STORE_SCREENSHOTS_RENDERED_PATH" -type f | wc -l | tr -d ' ')" = "66"

      - name: Update App Store Connect screenshot draft
        working-directory: apps/macos
        run: bundle exec fastlane mac sync_app_store_screenshots
