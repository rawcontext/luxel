name: App Store Localized Screenshots

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Editable App Store Connect version to update (for example, 1.2.0)"
        required: true
        type: string

concurrency:
  group: app-store-screenshots
  cancel-in-progress: false

jobs:
  sync-screenshots:
    name: Update Localized Screenshots
    if: >-
      github.repository == 'rawcontext/luxel' &&
      github.repository_id == '1269656539' &&
      github.actor_id == '302437' &&
      github.triggering_actor == 'ccheney' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: macos-26
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_ENABLE_BETA_DELIVER_SYNC_SCREENSHOTS: "true"
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_VERSION: ${{ inputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bazel
        id: bazel
        uses: ./.github/actions/setup-bazel

      - name: Set up Ruby
        uses: ./.github/actions/setup-ruby
        with:
          bundle-install: "true"

      - name: Render and validate localized screenshots
        run: |
          bazel build --config=ci //app-store:metadata_check //app-store:localized_screenshots
          rendered="$(bazel cquery --config=ci --output=files //app-store:screenshot_files)"
          test "$(find "$GITHUB_WORKSPACE/$rendered" -type f | wc -l | tr -d ' ')" = "66"
          echo "APP_STORE_SCREENSHOTS_PATH=$GITHUB_WORKSPACE/app-store/screenshots/localized" >> "$GITHUB_ENV"

      - name: Update App Store Connect screenshot draft
        working-directory: apps/macos
        run: bundle exec fastlane mac sync_app_store_screenshots

      - name: Save Bazel caches
        if: always() && !cancelled()
        uses: ./.github/actions/save-bazel-cache
        with:
          action-cache-key: ${{ steps.bazel.outputs.action-cache-key }}
          repository-cache-key: ${{ steps.bazel.outputs.repository-cache-key }}
          repository-cache-hit: ${{ steps.bazel.outputs.repository-cache-hit }}
