name: App Store Feedback

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
      timezone: America/Chicago

concurrency:
  group: app-store-feedback
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: Test App Store sync
    runs-on: [self-hosted, macOS, ARM64, luxel-desktop]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ./.github/actions/setup-ruby

      - name: Run tests
        run: |
          ruby .github/scripts/sync_app_store_reviews_test.rb
          ruby .github/scripts/sync_app_store_crashes_test.rb
          ruby .github/scripts/sync_app_store_actionable_test.rb

  actionable:
    name: Sync actionable App Store feedback
    needs: test
    runs-on: [self-hosted, macOS, ARM64, luxel-desktop]
    env:
      GH_TOKEN: ${{ github.token }}
      APP_STORE_CONNECT_APP_ID: "6800438206"
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ./.github/actions/setup-ruby

      - name: Sync App Store reviews
        run: ruby .github/scripts/sync_app_store_reviews.rb

      - name: Sync App Store crashes and diagnostics
        run: ruby .github/scripts/sync_app_store_crashes.rb

      - name: Sync feedback, regressions, rejections, and failed uploads
        run: ruby .github/scripts/sync_app_store_actionable.rb
