name: Validate Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate GitHub-hosted macOS
    if: >-
      github.repository == 'rawcontext/luxel' &&
      github.repository_id == '1269656539' &&
      github.actor_id == '302437' &&
      github.triggering_actor == 'ccheney' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby and Fastlane
        uses: ./.github/actions/setup-ruby
        with:
          bundle-install: "true"

      - name: Verify toolchain
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          swift --version
          ruby --version
          gh --version

      - name: Verify Fastlane loads
        working-directory: apps/macos
        run: bundle exec fastlane lanes

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Lint CLI workspace
        run: |
          bun install --frozen-lockfile
          bunx turbo run lint --filter=@luxel/cli
