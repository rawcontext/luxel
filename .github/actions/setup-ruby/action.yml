name: Set up Ruby
description: Use the repository-pinned Ruby on the Mac Mini runner

inputs:
  bundle-install:
    description: Install the macOS Fastlane bundle
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Select pinned Xcode
      if: inputs.bundle-install == 'true'
      shell: bash
      run: |
        selected_dir="$(env -u DEVELOPER_DIR xcode-select -p 2>/dev/null || true)"
        shopt -s nullglob
        candidates=(
          "${DEVELOPER_DIR:-}"
          "${selected_dir}"
          "$HOME"/Applications/Xcode*.app/Contents/Developer
          /Applications/Xcode*.app/Contents/Developer
        )
        expected_version=$'Xcode 26.6\nBuild version 17F113'
        developer_dir=""

        for candidate in "${candidates[@]}"; do
          [[ -d "${candidate}" ]] || continue
          version="$(DEVELOPER_DIR="${candidate}" xcodebuild -version 2>/dev/null || true)"

          if [[ "${version}" == "${expected_version}" ]]; then
            developer_dir="${candidate}"
            break
          fi
        done

        if [[ -z "${developer_dir}" ]]; then
          echo "Xcode 26.6 build 17F113 is not installed on this runner." >&2
          exit 1
        fi

        toolchain_bin="${developer_dir}/Toolchains/XcodeDefault.xctoolchain/usr/bin"
        sdk_root="${developer_dir}/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
        test -x "${toolchain_bin}/swift"
        test -d "${sdk_root}"

        echo "DEVELOPER_DIR=${developer_dir}" >> "${GITHUB_ENV}"
        echo "SDKROOT=${sdk_root}" >> "${GITHUB_ENV}"
        echo "CC=${toolchain_bin}/clang" >> "${GITHUB_ENV}"
        echo "CXX=${toolchain_bin}/clang++" >> "${GITHUB_ENV}"
        echo "${toolchain_bin}" >> "${GITHUB_PATH}"

    - name: Ensure pinned Ruby is installed
      shell: bash
      run: |
        expected_version="$(awk '$1 == "ruby" { print $2 }' .tool-versions)"

        if ! /opt/homebrew/bin/brew list --versions ruby >/dev/null 2>&1; then
          HOMEBREW_NO_AUTO_UPDATE=1 /opt/homebrew/bin/brew install ruby
        fi

        ruby_bin="$(/opt/homebrew/bin/brew --prefix ruby)/bin"
        actual_version="$("${ruby_bin}/ruby" -e 'print RUBY_VERSION')"

        if [[ "${actual_version}" != "${expected_version}" ]]; then
          echo "Homebrew Ruby ${actual_version} does not match pinned Ruby ${expected_version}." >&2
          exit 1
        fi

        bundler_version="$(awk '/^BUNDLED WITH$/ { getline; gsub(/^[[:space:]]+/, ""); print }' apps/macos/Gemfile.lock)"
        user_gem_bin="$("${ruby_bin}/ruby" -e 'print Gem.user_dir')/bin"
        "${ruby_bin}/gem" install --user-install bundler --version "${bundler_version}" --no-document

        echo "${ruby_bin}" >> "${GITHUB_PATH}"
        echo "${user_gem_bin}" >> "${GITHUB_PATH}"

    - name: Install Fastlane bundle
      if: inputs.bundle-install == 'true'
      shell: bash
      working-directory: apps/macos
      run: |
        bundle_path="${RUNNER_TEMP}/luxel-bundle"
        echo "BUNDLE_PATH=${bundle_path}" >> "${GITHUB_ENV}"
        DEVELOPER_DIR=/Library/Developer/CommandLineTools \
          BUNDLE_PATH="${bundle_path}" \
          bundle install --jobs 4 --retry 3
