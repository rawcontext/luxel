name: Set up Ruby
description: Use the repository-pinned Ruby on GitHub-hosted macOS

inputs:
  bundle-install:
    description: Install the macOS Fastlane bundle
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Select pinned Xcode
      if: inputs.bundle-install == 'true'
      shell: bash
      run: |
        selected_dir="$(env -u DEVELOPER_DIR xcode-select -p 2>/dev/null || true)"
        shopt -s nullglob
        candidates=(
          "${DEVELOPER_DIR:-}"
          "${selected_dir}"
          "$HOME"/Applications/Xcode*.app/Contents/Developer
          /Applications/Xcode*.app/Contents/Developer
        )
        expected_version=$'Xcode 26.6\nBuild version 17F113'
        developer_dir=""

        for candidate in "${candidates[@]}"; do
          [[ -d "${candidate}" ]] || continue
          version="$(DEVELOPER_DIR="${candidate}" xcodebuild -version 2>/dev/null || true)"

          if [[ "${version}" == "${expected_version}" ]]; then
            developer_dir="${candidate}"
            break
          fi
        done

        if [[ -z "${developer_dir}" ]]; then
          echo "Xcode 26.6 build 17F113 is not installed on this runner." >&2
          exit 1
        fi

        toolchain_bin="${developer_dir}/Toolchains/XcodeDefault.xctoolchain/usr/bin"
        sdk_root="${developer_dir}/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
        test -x "${toolchain_bin}/swift"
        test -d "${sdk_root}"

        echo "DEVELOPER_DIR=${developer_dir}" >> "${GITHUB_ENV}"
        echo "SDKROOT=${sdk_root}" >> "${GITHUB_ENV}"
        echo "CC=${toolchain_bin}/clang" >> "${GITHUB_ENV}"
        echo "CXX=${toolchain_bin}/clang++" >> "${GITHUB_ENV}"
        echo "${toolchain_bin}" >> "${GITHUB_PATH}"

    - name: Read pinned Ruby version
      id: ruby
      shell: bash
      run: |
        ruby_version="$(awk '$1 == "ruby" { print $2 }' .tool-versions)"
        test -n "$ruby_version"
        echo "version=$ruby_version" >> "$GITHUB_OUTPUT"

    - name: Set up pinned Ruby and Bundler
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      env:
        DEVELOPER_DIR: /Library/Developer/CommandLineTools
      with:
        ruby-version: ${{ steps.ruby.outputs.version }}
        working-directory: apps/macos
        bundler-cache: ${{ inputs.bundle-install == 'true' }}

    - name: Verify GitHub CLI
      shell: bash
      run: gh --version
