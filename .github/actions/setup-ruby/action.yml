name: Set up Ruby
description: Use the repository-pinned Ruby on the Mac Mini runner

inputs:
  bundle-install:
    description: Install the macOS Fastlane bundle
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Ensure pinned Ruby is installed
      shell: bash
      run: |
        if [[ ! -d "${DEVELOPER_DIR:-}" ]]; then
          developer_dir="$(env -u DEVELOPER_DIR xcode-select -p)"
          test -d "${developer_dir}"
          export DEVELOPER_DIR="${developer_dir}"
          echo "DEVELOPER_DIR=${developer_dir}" >> "${GITHUB_ENV}"
        fi

        expected_version="$(awk '$1 == "ruby" { print $2 }' .tool-versions)"

        if ! /opt/homebrew/bin/brew list --versions ruby >/dev/null 2>&1; then
          HOMEBREW_NO_AUTO_UPDATE=1 /opt/homebrew/bin/brew install ruby
        fi

        ruby_bin="$(/opt/homebrew/bin/brew --prefix ruby)/bin"
        actual_version="$("${ruby_bin}/ruby" -e 'print RUBY_VERSION')"

        if [[ "${actual_version}" != "${expected_version}" ]]; then
          echo "Homebrew Ruby ${actual_version} does not match pinned Ruby ${expected_version}." >&2
          exit 1
        fi

        bundler_version="$(awk '/^BUNDLED WITH$/ { getline; gsub(/^[[:space:]]+/, ""); print }' apps/macos/Gemfile.lock)"
        user_gem_bin="$("${ruby_bin}/ruby" -e 'print Gem.user_dir')/bin"
        "${ruby_bin}/gem" install --user-install bundler --version "${bundler_version}" --no-document

        echo "${ruby_bin}" >> "${GITHUB_PATH}"
        echo "${user_gem_bin}" >> "${GITHUB_PATH}"

    - name: Install Fastlane bundle
      if: inputs.bundle-install == 'true'
      shell: bash
      working-directory: apps/macos
      run: |
        bundle_path="${RUNNER_TEMP}/luxel-bundle"
        echo "BUNDLE_PATH=${bundle_path}" >> "${GITHUB_ENV}"
        BUNDLE_PATH="${bundle_path}" bundle install --jobs 4 --retry 3
