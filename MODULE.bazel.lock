: dict(deps.items() + common_items)})\n\n    return select(crate_aliases)\n\n###############################################################################\n# WORKSPACE MEMBER DEPS, ALIASES, AND EDITIONS\n###############################################################################\n\n_CRATE_EDITIONS = {\n    \"apps/cli\": \"2024\",\n}\n\n_NORMAL_DEPENDENCIES = {\n    \"apps/cli\": {\n        _COMMON_CONDITION: {\n            \"base64\": Label(\"@crates//base64-0.23.1\"),\n            \"clap\": Label(\"@crates//clap-4.6.6\"),\n            \"hex\": Label(\"@crates//hex-0.4.3\"),\n            \"hmac\": Label(\"@crates//hmac-0.13.0\"),\n            \"keyring\": Label(\"@crates//keyring-4.1.6\"),\n            \"rand\": Label(\"@crates//rand-0.10.2\"),\n            \"serde\": Label(\"@crates//serde-1.0.229\"),\n            \"serde_json\": Label(\"@crates//serde_json-1.0.151\"),\n            \"sha2\": Label(\"@crates//sha2-0.11.0\"),\n            \"thiserror\": Label(\"@crates//thiserror-2.0.20\"),\n            \"url\": Label(\"@crates//url-2.5.8\"),\n            \"uuid\": Label(\"@crates//uuid-1.24.0\"),\n        },\n    },\n}\n\n\n_NORMAL_ALIASES = {\n    \"apps/cli\": {\n        _COMMON_CONDITION: {\n        },\n    },\n}\n\n\n_NORMAL_DEV_DEPENDENCIES = {\n    \"apps/cli\": {\n    },\n}\n\n\n_NORMAL_DEV_ALIASES = {\n    \"apps/cli\": {\n    },\n}\n\n\n_PROC_MACRO_DEPENDENCIES = {\n    \"apps/cli\": {\n    },\n}\n\n\n_PROC_MACRO_ALIASES = {\n    \"apps/cli\": {\n    },\n}\n\n\n_PROC_MACRO_DEV_DEPENDENCIES = {\n    \"apps/cli\": {\n    },\n}\n\n\n_PROC_MACRO_DEV_ALIASES = {\n    \"apps/cli\": {\n    },\n}\n\n\n_BUILD_DEPENDENCIES = {\n    \"apps/cli\": {\n    },\n}\n\n\n_BUILD_ALIASES = {\n    \"apps/cli\": {\n    },\n}\n\n\n_BUILD_PROC_MACRO_DEPENDENCIES = {\n    \"apps/cli\": {\n    },\n}\n\n\n_BUILD_PROC_MACRO_ALIASES = {\n    \"apps/cli\": {\n    },\n}\n\n\n_CONDITIONS = {\n    \"aarch64-apple-darwin\": [\"@rules_rust//rust/platform:aarch64-apple-darwin\"],\n    \