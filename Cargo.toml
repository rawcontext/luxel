[package]
name = "luxel-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Command-line controller for the Luxel macOS app"
license = "MIT"
repository = "https://github.com/rawcontext/luxel-cli"

[[bin]]
name = "luxel"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
hmac = "0.13.0"
keyring = "4.1.6"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
